name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install
        run: if [ -f composer.json ]; then composer install --no-interaction --prefer-dist --no-progress; fi
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l
      - name: Test
        run: if [ -x vendor/bin/phpunit ]; then vendor/bin/phpunit; else echo "no phpunit"; fi
