name: 🐛 Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
  - type: input
    attributes:
      label: Version / environment
      placeholder: e.g. v0.1.0, Ubuntu 24.04
