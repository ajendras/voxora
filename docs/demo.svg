<svg xmlns="http://www.w3.org/2000/svg" width="900" height="546" viewBox="0 0 900 546" role="img" aria-label="Voxora — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="546" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="546" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">Voxora — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#6366f1">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 0.90s steps(20) 0.60s forwards" fill="#e5e7eb">php public/index.php</text>
<text x="50" y="100" class="l" style="animation:show .01s 1.80s forwards" fill="#94a3b8">Voxora web server started on http://localhost:8080</text>
<text x="50" y="126" class="l" style="animation:show .01s 2.02s forwards" fill="#94a3b8">Visit /dashboard to open the polished UI</text>
<text x="28" y="178" class="l" style="animation:show .01s 2.59s forwards"><tspan fill="#6366f1">❯</tspan></text><text x="50" y="178" class="l ty" style="animation:show .01s 2.59s forwards,type 2.20s steps(77) 2.59s forwards" fill="#e5e7eb">curl -X POST http://localhost:8080/api/v1/speech -H &apos;Authorization: Bearer v…</text>
<text x="50" y="204" class="l" style="animation:show .01s 5.09s forwards" fill="#94a3b8">{&quot;id&quot;:&quot;gen_9k2m&quot;,&quot;url&quot;:&quot;/storage/gen_9k2m.mp3&quot;,&quot;duration&quot;:3.2,&quot;cost&quot;:0.012}</text>
<text x="50" y="230" class="l" style="animation:show .01s 5.31s forwards" fill="#94a3b8">File written to storage/gen_9k2m.mp3</text>
<text x="28" y="282" class="l" style="animation:show .01s 5.88s forwards"><tspan fill="#6366f1">❯</tspan></text><text x="50" y="282" class="l ty" style="animation:show .01s 5.88s forwards,type 1.49s steps(33) 5.88s forwards" fill="#e5e7eb">php examples/batch.php voices.csv</text>
<text x="50" y="308" class="l" style="animation:show .01s 7.67s forwards" fill="#94a3b8">Loaded 8 rows from voices.csv</text>
<text x="50" y="334" class="l" style="animation:show .01s 7.89s forwards" fill="#94a3b8">Generated 8 audio files in 14.8 s</text>
<text x="50" y="360" class="l" style="animation:show .01s 8.11s forwards" fill="#94a3b8">Report written to output/batch-report.json</text>
<text x="28" y="412" class="l" style="animation:show .01s 8.68s forwards"><tspan fill="#6366f1">❯</tspan></text><text x="50" y="412" class="l ty" style="animation:show .01s 8.68s forwards,type 1.62s steps(36) 8.68s forwards" fill="#e5e7eb">open http://localhost:8080/dashboard</text>
<text x="50" y="438" class="l" style="animation:show .01s 10.60s forwards" fill="#94a3b8">Responsive dashboard loads with dark/light mode</text>
<text x="50" y="464" class="l" style="animation:show .01s 10.82s forwards" fill="#94a3b8">Browse voice library, projects and generation history</text>
<g class="l" style="animation:show .01s 11.39s forwards"><text x="28" y="516" fill="#6366f1">❯</text><rect class="cur" x="50" y="501" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
